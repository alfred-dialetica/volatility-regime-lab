name: Refresh public market data

on:
  schedule:
    - cron: "15 3 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-market-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild dashboard dataset
        run: python fetch_data.py
      - name: Commit changed observations
        run: |
          if git diff --quiet -- data.js; then
            echo "No new public observations."
            exit 0
          fi
          git config user.name "alfred-dialetica"
          git config user.email "alfred-dialetica@users.noreply.github.com"
          git add data.js
          git commit -m "data: refresh public EOD observations"
          git push

